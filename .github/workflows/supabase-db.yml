name: Supabase migrations

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-db.yml"
  workflow_dispatch:
    inputs:
      run_seed:
        description: "After migrate, run npm run seed:catalog (needs service role secrets)"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project and push migrations
        run: |
          set -euo pipefail
          PROJECT_REF="${SUPABASE_PROJECT_REF:-ktfwmfdlmcgpbdnsggrb}"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
          supabase db push --yes

  seed:
    needs: migrate
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed == 'true' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed catalog
        run: npm run seed:catalog
